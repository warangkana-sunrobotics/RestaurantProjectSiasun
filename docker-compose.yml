# include:
#   - path: ./airflow.yml

services:
  postgres:
    image: postgres:13
    container_name: daily-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_CONN_DAILY_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_CONN_DAILY_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CONN_DAILY_DB}
    ports:
      # Bind to 127.0.0.1 only: the database must not be reachable from the other machine.
      # The api container reach it through the docker network( postgres:5432 ), not this port.
      - "127.0.0.1:${POSTGRES_CONN_DAILY_PORT}:5432"   # host 5435 -> Postgres's internal port 5432
    volumes:
    # If start with ( ./ = bind mount, it will read data on the local pc )( [name] = the docker will handle the data automatically )
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/empty-db-startup.sql:/docker-entrypoint-initdb.d/empty-db-startup.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_CONN_DAILY_USERNAME}", "-d", "${POSTGRES_CONN_DAILY_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    # Use build command to build from the localhost( Dockerfile in localhost )
    build:
      context: .
      dockerfile: dockerfile
    container_name: daily-api
    ports:
      # Put the reverse proxy( nginx / caddy ) with HTTPS in front of this port for the customer.
      - "8000:8000"
    # The secrets come from the .env on the host( .env is not copied into the image )
    env_file:
      - .env
    # Wait the realte service to complete run with the check healthy
    depends_on:
      postgres:
        # Wait until Postgres is ready
        condition: service_healthy
    environment:
      DB_HOST: postgres
      # env_file value is overwritten here: inside the docker network Postgres always listen on 5432.
      POSTGRES_CONN_DAILY_PORT: 5432
    restart: unless-stopped

volumes:
  postgres-data:
